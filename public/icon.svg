<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(113, 130, 255, 0.5)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.2)" />
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7182ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="supGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#7182ff" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="240" cy="240" r="190" fill="url(#glow)" />

  <!-- Monogram Logo C² -->
  <g filter="url(#subtleShadow)">
    <!-- Stylized Precision 'C' Arc -->
    <path 
      d="M 315 175 C 290 145 255 130 210 130 C 138 130 85 185 85 256 C 85 327 138 382 210 382 C 260 382 295 362 320 328" 
      fill="none" 
      stroke="url(#cGrad)" 
      stroke-width="52" 
      stroke-linecap="round" 
    />

    <!-- Superscript '2' -->
    <!-- Geometric '2' with modern styling -->
    <path 
      d="M 360 145 C 360 125 375 110 398 110 C 420 110 436 125 436 145 C 436 168 410 192 360 235 L 440 235 L 440 210" 
      fill="none" 
      stroke="url(#supGrad)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Small Cyan Status Dot -->
    <circle cx="438" cy="118" r="7" fill="#38bdf8" />
  </g>
</svg>
