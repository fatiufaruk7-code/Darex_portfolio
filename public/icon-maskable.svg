<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <radialGradient id="glowMask" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7182ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="supGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#7182ff" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="subtleShadowMask" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable adaptive clipping -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowMask)" />

  <!-- Monogram Logo C² within 80% safe zone (scaled 0.78 and centered) -->
  <g transform="translate(42, 42) scale(0.83)" filter="url(#subtleShadowMask)">
    <!-- Stylized Precision 'C' Arc -->
    <path 
      d="M 315 175 C 290 145 255 130 210 130 C 138 130 85 185 85 256 C 85 327 138 382 210 382 C 260 382 295 362 320 328" 
      fill="none" 
      stroke="url(#cGradMask)" 
      stroke-width="50" 
      stroke-linecap="round" 
    />

    <!-- Superscript '2' -->
    <path 
      d="M 360 145 C 360 125 375 110 398 110 C 420 110 436 125 436 145 C 436 168 410 192 360 235 L 440 235 L 440 210" 
      fill="none" 
      stroke="url(#supGradMask)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <circle cx="438" cy="118" r="7" fill="#38bdf8" />
  </g>
</svg>
